<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Certificados - Study-Connect</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
</head>

<body>

<header>
<h1>🎓 Certificados emitidos</h1>
<p>Panel de Administración</p>
</header>


<main class="contenedor">

<h2>Lista de certificados</h2>

<table border="1" width="100%">

<tr>
<th>Alumno</th>
<th>Curso</th>
<th>Número de certificado</th>
<th>Estado</th>
<th>Acción</th>
</tr>

<tbody id="listaCertificados">

</tbody>

</table>


<br>

<a href="../admin.html" class="boton">
⬅ Volver al panel de Administración
</a>

</main>


<script>
    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));

if (!usuario || usuario.rol !== "admin") {
    window.location.href = "../../../index.html";
} else {

let estudiantes =
JSON.parse(localStorage.getItem("estudiantes")) || [];

let tabla =
document.getElementById("listaCertificados");

estudiantes.forEach(estudiante => {

    if(
        !estudiante ||
        !estudiante.nombre ||
        !estudiante.curso ||
        !estudiante.certificado ||
        estudiante.certificado === "Sin certificado"
    ){
        return;
    }

    tabla.innerHTML += `
    <tr>
        <td>${estudiante.nombre}</td>
        <td>${estudiante.curso}</td>
        <td>${estudiante.certificado}</td>
        <td>✅ Aprobado</td>
        <td>
            <button class="boton"
                onclick="verCertificado('${estudiante.certificado}')">
                👁️ Ver
            </button>
        </td>
    </tr>`;

});

function verCertificado(numero){

    window.location.href =
    "../../certificado.html?certificado=" + numero;

}
}
</script>


</body>
</html>
